name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish using this workflow (empty = build only)
        required: false
        type: string
        default: ''

# No build script or ordinary action receives a publishing/signing token.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - name: Resolve immutable release source
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          if [ -n "$tag" ]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Invalid version tag'; exit 1; }
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        # Parse TOML rather than matching unrelated version fields with sed.
        # Manual publication must specify an existing immutable version tag.
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          if os.environ.get("RELEASE_TAG"):
              expected = f"v{version}"
              actual = os.environ["RELEASE_TAG"]
              if actual != expected:
                  raise SystemExit(f"Tag {actual!r} does not match Cargo.toml {expected!r}")
          else:
              print("Non-tag run: checks and build only; publishing is disabled.")

  checks:
    name: Required release checks
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.version.outputs.source-sha }}
    permissions:
      contents: read

  build:
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
      AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
      RUSTFLAGS: -C target-feature=+crt-static
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.source-sha }}
      - name: Use installed Rust toolchain
        timeout-minutes: 2
        run: |
          set -euo pipefail
          rustc +stable --version
          cargo +stable --version
      - name: Install Windows Rust standard library
        timeout-minutes: 4
        run: |
          set -euo pipefail
          timeout 180s rustup target add --toolchain stable x86_64-pc-windows-gnu
      - name: Ensure Windows GNU C compiler
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null; then
            # Do not refresh every runner package or stall on unrelated apt
            # repositories. The Ubuntu image already has package indexes.
            sudo timeout 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y gcc-mingw-w64-x86-64
          fi
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-ar --version
      - run: cargo +stable build --release --locked --target x86_64-pc-windows-gnu
      - name: Stage static GNU executable and checksum
        run: |
          mkdir dist
          cp target/x86_64-pc-windows-gnu/release/monitor-agent.exe dist/monitor-agent-x86_64-pc-windows-gnu.exe
          (cd dist && sha256sum monitor-agent-x86_64-pc-windows-gnu.exe > sha256sums.txt)
          # Carry reviewed text through the immutable build artifact. The
          # publishing job does not check out or execute repository code.
          if [ -n "$RELEASE_TAG" ] && [ -f "release-notes/$RELEASE_TAG.md" ]; then
            cp "release-notes/$RELEASE_TAG.md" dist/release-notes.md
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: x86_64-pc-windows-gnu
          path: |
            dist/monitor-agent-x86_64-pc-windows-gnu.exe
            dist/sha256sums.txt
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest checked release artifact
    if: needs.version.outputs.publish == 'true'
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No checkout, compilation or execution of repository code in this job.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - name: Check downloaded executable
        working-directory: dist
        run: sha256sum --check sha256sums.txt
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/monitor-agent-x86_64-pc-windows-gnu.exe

  release:
    if: needs.version.outputs.publish == 'true'
    needs: [version, build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Select the immutable artifact ID from this build, not a wildcard/name
      # search that could accidentally pick up an unrelated artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - name: Verify checksum and publish
        working-directory: dist
        run: |
          sha256sum --check sha256sums.txt
          notes=(--generate-notes)
          if [ -f release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          fi
          title="$RELEASE_TAG"
          if [ "$RELEASE_TAG" = v1.2.3 ]; then
            title="$RELEASE_TAG — Windows 安全修订版"
          fi
          gh release create "$RELEASE_TAG" \
            monitor-agent-x86_64-pc-windows-gnu.exe sha256sums.txt \
            --verify-tag --title "$title" "${notes[@]}" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
