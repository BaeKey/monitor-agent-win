name: ci

on:
  push:
    branches: [main, "codex/**"]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  # Release must execute these checks on its own commit, not rely on a prior PR.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Separate reusable release calls from ordinary CI runs for the same ref.
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Windows GNU lint and static release build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
      AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Use the runner's rustup rather than an unpinned toolchain action.
      - name: Install Rust and Windows GNU cross compiler
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-gnu
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64
      - run: cargo +stable fmt --all --check
      - run: cargo +stable check --locked --target x86_64-pc-windows-gnu
      - name: Clippy with public diagnostic annotations
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable clippy --locked --target x86_64-pc-windows-gnu --all-targets --message-format=json -- -D warnings 2>&1 | python3 .github/scripts/annotations.py
      - name: Verify shipping Windows GNU static release build
        timeout-minutes: 25
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo +stable build --release --locked --target x86_64-pc-windows-gnu

  windows-test:
    name: Execute tests on Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # MSVC and the Windows SDK are provided by windows-latest. This target
      # actually runs the Win32 tests; GNU remains the shipping target below.
      - name: Install Windows Rust toolchain
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - name: Run all tests (not just compile them)
        run: cargo +stable test --locked --target x86_64-pc-windows-msvc --all-targets
      - name: Build executable for actual service installation smoke test
        run: cargo +stable build --locked --target x86_64-pc-windows-msvc
      - name: Install, coexist, upgrade and remove actual Windows services
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = Join-Path $PWD 'target/x86_64-pc-windows-msvc/debug/monitor-agent.exe'
          $names = @('monitor-agent-ci-a', 'monitor-agent-ci-b')
          function Invoke-Agent([string[]] $Arguments) {
            $output = @(& $exe @Arguments 2>&1)
            $code = $LASTEXITCODE
            $output | Write-Output
            if ($code -ne 0) {
              throw "agent exit ${code}: $($output -join ' ')"
            }
          }
          try {
            foreach ($name in $names) {
              Invoke-Agent @('install', '--service-name', $name, '--server', 'https://127.0.0.1:9', '--token', 'ci-synthetic-token')
              $service = Get-Service -Name $name
              if ($service.Status -ne 'Running') { throw "$name did not become Running" }
            }
            # Same name is an upgrade, not a second service. Both instances use
            # the shared exe and must recover after its atomic replacement.
            Invoke-Agent @('install', '--service-name', $names[0], '--interval', '2')
            foreach ($name in $names) {
              if ((Get-Service -Name $name).Status -ne 'Running') { throw "$name not restored after upgrade" }
            }
            Invoke-Agent @('stop', '--service-name', $names[0])
            Invoke-Agent @('start', '--service-name', $names[0])
          } catch {
            $detail = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Actual Windows service lifecycle failed::$detail"
            throw
          } finally {
            foreach ($name in $names) {
              if (Get-Service -Name $name -ErrorAction SilentlyContinue) {
                & $exe uninstall --service-name $name
                if ($LASTEXITCODE -ne 0) { Write-Output "::error::Failed to remove CI service $name" }
              }
            }
          }
      - name: Run all elevated filesystem and SCM recovery regressions
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          try {
            $principal = [System.Security.Principal.WindowsPrincipal]::new($identity)
            if (-not $principal.IsInRole([System.Security.Principal.WindowsBuiltInRole]::Administrator)) {
              throw 'Ignored security regressions require an elevated administrator token; refusing to skip. Use an elevated Windows runner.'
            }
          } finally {
            $identity.Dispose()
          }
          # A filtered cargo test can succeed with zero tests. Require all known
          # security regressions, then execute EVERY ignored test without a filter.
          $expected = @(
            'secure_fs::tests::protected_filesystem_regression'
            'install::recovery_tests::full_scm_snapshot_restores_every_changed_property'
            'install::recovery_tests::durable_config_backup_survives_drop_and_replays_idempotently'
          )
          $listed = & cargo +stable test --locked --target x86_64-pc-windows-msvc --all-targets -- --list --ignored
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to enumerate ignored security regressions.'
          }
          foreach ($testName in $expected) {
            if (-not ($listed -contains "${testName}: test")) {
              throw "Expected ignored security regression was not found: $testName; refusing to skip."
            }
          }
          # Handle native exit codes ourselves, including when runner defaults
          # enable PSNativeCommandUseErrorActionPreference in PowerShell 7.
          $PSNativeCommandUseErrorActionPreference = $false
          $captured = @()
          $savedErrorActionPreference = $ErrorActionPreference
          try {
            # Older PowerShell 7 versions can turn redirected native stderr into
            # ErrorRecords. Keep capturing it instead of terminating before Tee.
            $ErrorActionPreference = 'Continue'
            & cargo +stable test --locked --target x86_64-pc-windows-msvc --all-targets -- --ignored --nocapture 2>&1 | Tee-Object -Variable captured -ErrorAction Stop
            $testExitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $savedErrorActionPreference
          }
          if ($testExitCode -ne 0) {
            $detail = ($captured | ForEach-Object { $_.ToString() }) -join "`n"
            # Keep the tail containing panic/failure summaries. 16,000 UTF-16
            # units expand to at most 48,000 after workflow-command escaping,
            # leaving room for the heading below within the 50k character cap.
            if ($detail.Length -gt 16000) {
              $detail = '[earlier output truncated]' + "`n" + $detail.Substring($detail.Length - 16000)
            }
            if ([string]::IsNullOrWhiteSpace($detail)) {
              $detail = 'Cargo produced no captured output.'
            }
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Elevated security regressions failed::Cargo exit code ${testExitCode}.%0A${detail}"
            # Tee/annotation commands must not overwrite Cargo's failure status.
            exit $testExitCode
          }

  rustsec:
    name: RustSec dependency audit
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
